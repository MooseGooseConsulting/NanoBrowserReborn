name: Setup extension workspace
description: Node from apps/extension/.nvmrc, Corepack pnpm, frozen lockfile install

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: apps/extension/.nvmrc
        # pnpm is not on PATH until Corepack is enabled, so setup-node cannot
        # cache the pnpm store here. The store is cached after Corepack below.
        package-manager-cache: false

    - name: Enable Corepack
      shell: bash
      # Node 22.12 ships Corepack <0.31, which rejects npm's rotated signing key.
      # Pin Corepack so CI does not float on @latest.
      run: |
        npm install -g corepack@0.34.6
        corepack enable
        corepack prepare pnpm@9.15.1 --activate

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      working-directory: apps/extension
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "node=$(node -v)" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ steps.pnpm-store.outputs.node }}-pnpm-${{ steps.pnpm-store.outputs.pnpm }}-${{ hashFiles('apps/extension/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.pnpm-store.outputs.node }}-pnpm-${{ steps.pnpm-store.outputs.pnpm }}-

    - name: Install
      shell: bash
      working-directory: apps/extension
      env:
        CI: true
        HUSKY: '0'
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: corepack pnpm install --frozen-lockfile
